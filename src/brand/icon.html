<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* 512×512 기준. 마스커블 아이콘 안전영역(가운데 80%) 안에 내용을 둔다.
   고양이는 원본 PNG를 그대로 얹는다 (cat/turnaround_01_front.png). */
html,body{margin:0;width:512px;height:512px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#1a0f42 0%,#3d1163 55%,#7a1e63 100%)}
.sun{position:absolute;left:106px;top:96px;width:300px;height:300px;border-radius:50%;
  background:linear-gradient(180deg,#ffe14d,#ff6ec7 60%,#ff2e93);opacity:.92;
  -webkit-mask:repeating-linear-gradient(#000 0 20px,transparent 20px 29px)}
.floor{position:absolute;left:-50%;bottom:-20px;width:200%;height:170px;transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
  background-image:linear-gradient(#59ffd0aa 3px,transparent 3px),linear-gradient(90deg,#59ffd099 3px,transparent 3px);background-size:44px 44px}
.cat{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);height:376px;
  filter:drop-shadow(0 14px 20px rgba(0,0,0,.5))}
</style></head><body>
<div class="sun"></div><div class="floor"></div>
<img class="cat" src="cat/turnaround_01_front.png" alt="">
</body></html>
