<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../mascot.css">
<style>
/* 512×512 기준. 마스커블 아이콘 안전영역(가운데 80%) 안에 내용을 둔다 */
html,body{margin:0;width:512px;height:512px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#1a0f42 0%,#3d1163 55%,#7a1e63 100%)}
.sun{position:absolute;left:96px;top:100px;width:320px;height:320px;border-radius:50%;
  background:linear-gradient(180deg,#ffe14d,#ff6ec7 60%,#ff2e93);opacity:.9;
  -webkit-mask:repeating-linear-gradient(#000 0 22px,transparent 22px 32px)}
.floor{position:absolute;left:-50%;bottom:-20px;width:200%;height:170px;transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
  background-image:linear-gradient(#59ffd0aa 3px,transparent 3px),linear-gradient(90deg,#59ffd099 3px,transparent 3px);background-size:44px 44px}
/* 고양이 역장 얼굴만 잘라 쓴다 — 작은 크기에서도 실루엣이 남는다 */
.cat{position:absolute;left:62px;top:52px;width:388px;height:388px;overflow:hidden}
.cat .mas{width:436px;margin:0 0 0 -25px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.cat .m-all,.cat .m-tail{animation:none!important}
</style></head><body>
<div class="sun"></div><div class="floor"></div>
<div class="cat" id="cat"></div>
<script src="../mascot.js"></script>
<script>
  var c = MAS.make({bubble:false});
  c.face("base");
  document.getElementById("cat").appendChild(c.el);
</script>
</body></html>
