<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../mascot.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#120a2e 0%,#2a0f4e 45%,#5b1670 80%,#7a1e63 100%);font-family:"Noto Sans KR",sans-serif;color:#fff}
.sun{position:absolute;left:830px;top:150px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
  background:linear-gradient(180deg,#ffe14d,#ff6ec7 60%,#ff2e93);opacity:.5;
  -webkit-mask:repeating-linear-gradient(#000 0 18px,transparent 18px 26px);filter:drop-shadow(0 0 40px #ff2e93)}
.floor{position:absolute;left:-50%;bottom:-40px;width:200%;height:260px;transform:perspective(300px) rotateX(62deg);transform-origin:bottom;
  background-image:linear-gradient(#ff2e9366 2px,transparent 2px),linear-gradient(90deg,#ff2e9355 2px,transparent 2px);background-size:48px 48px;
  -webkit-mask:linear-gradient(180deg,transparent,#000 50%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000002a 3px 4px)}
/* 왼쪽 문구 · 오른쪽 고양이 역장 */
.wrap{position:absolute;left:64px;top:68px;width:660px;text-align:left}
.coin{font-family:"Press Start 2P";font-size:15px;color:#59ffd0;letter-spacing:3px}
h1{margin:20px 0 0;font-family:"Press Start 2P";font-weight:400;font-size:72px;line-height:1.08;color:#ffe14d;text-shadow:6px 6px 0 #ff2e93,11px 11px 0 #0006}
.sub{margin-top:34px;font-size:37px;font-weight:900;text-shadow:3px 3px 0 #0008}
.chips{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.chip{font-size:22px;font-weight:700;background:#0a0620cc;border:3px solid #ffe14d;border-radius:12px;padding:9px 16px;box-shadow:5px 5px 0 #ff2e93}
.chip.alt{border-color:#59ffd0;box-shadow:5px 5px 0 #2bd3ff}
.url{position:absolute;left:64px;bottom:30px;font-size:21px;font-weight:700;color:#ffffffc0}
.cat{position:absolute;right:38px;bottom:-6px;width:470px}
.cat .mas{width:470px}
.cat .m-all,.cat .m-tail{animation:none!important}   /* 스크린샷이니 정지 상태로 */
</style></head><body>
<div class="sun"></div><div class="floor"></div>
<div class="wrap">
  <div class="coin">◆ INSERT COIN ◆</div>
  <h1>GEO<br>ARCADE</h1>
  <div class="sub">타이핑으로 외우는 지리</div>
  <div class="chips">
    <span class="chip">🗾 일본 47</span><span class="chip">🏘️ 한국 시·군 167</span><span class="chip">🌍 세계 256</span>
    <span class="chip alt">🍊 특산물 퀴즈</span>
  </div>
</div>
<div class="url">snowater121.github.io/for-my-cat</div>
<div class="cat" id="cat"></div>
<div class="scan"></div>
<script src="../mascot.js"></script>
<script>
  var c = MAS.make({bubble:false});
  c.face("happy");
  document.getElementById("cat").appendChild(c.el);
</script>
</body></html>
